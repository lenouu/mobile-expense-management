

spring.application.name=expense-management-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/expense_management
spring.datasource.username=postgres
spring.datasource.password=root
# Fail fast when the database is down (default 30s), so GET /api/admin/health answers quickly.
spring.datasource.hikari.connection-timeout=5000
server.port=8083
spring.jpa.hibernate.ddl-auto=create



spring.jpa.show-sql=true

# ---------------------------------------------------------------------
# JWT (stateless authentication)
# ---------------------------------------------------------------------
# HS256 is symmetric: this one secret both signs and verifies tokens, so it
# must stay server-side. Nimbus requires at least 256 bits (32 bytes) of key
# material - a shorter value makes the app fail at startup with a clear message.
#
# REPLACE THIS before deploying, and keep the real value out of git:
#     app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.secret=dev-only-secret-change-me-0123456789abcdef
app.security.jwt.expiration-minutes=60
app.security.jwt.issuer=expense-management-backend

# ---------------------------------------------------------------------
# CORS
# ---------------------------------------------------------------------
# Comma-separated browser origins allowed to call this API.
# CORS is enforced by BROWSERS, so a native mobile client is unaffected by
# this setting entirely - it only matters for a web front end or Swagger UI.
# Prefer explicit origins over "*": allowCredentials is enabled, and a bare
# "*" would let any website make authenticated calls with a user's cookies.
# http://localhost:8081 is the Expo web dev server (mobile app opened in a browser).
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081

# ---------------------------------------------------------------------
# Error responses
# ---------------------------------------------------------------------
# Never leak a stack trace or the internal exception message to a client.
#
# NOTE the property names. Spring Boot 4 RENAMED these from server.error.* to
# spring.web.error.*. The old names still appear in Boot's metadata, but only
# as a "replacement" alias - they are ignored, so using them silently leaves
# stack traces switched on. That is exactly what happened in this project: a
# 404 returned the whole security filter chain while
# server.error.include-stacktrace=never sat here doing nothing.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# ---------------------------------------------------------------------
# OpenAPI / Swagger UI
# ---------------------------------------------------------------------
#   UI:   http://localhost:8083/swagger-ui.html
#   JSON: http://localhost:8083/v3/api-docs
# Both follow server.port at the top of this file - if you change the port
# again, change these two lines with it.
#
# Both are permitted anonymously in SecurityConfig, which means anyone who
# can reach the app can read the whole API surface. Before deploying, set
# springdoc.api-docs.enabled=false and springdoc.swagger-ui.enabled=false
# and remove the /v3/api-docs and /swagger-ui/** entries from
# PUBLIC_GET_ENDPOINTS.
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
# Keep the operation list in a predictable order rather than the order the
# scanner happened to find the controllers.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Lets "Try it out" actually fire requests, and shows how long each took.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true

# ---------------------------------------------------------------------
# Development seed data
# ---------------------------------------------------------------------
# On startup inserts 22 test accounts - 20 USER and 2 ADMIN - every one
# ACTIVE with the shared password: Password123!
#
# Admin logins: admin.amina / admin.youssef  (all other seeds are USER)
#
# DEVELOPMENT ONLY. These are known credentials written straight into the
# database; set this to false (or delete the line) before deploying.
# The class itself is @ConditionalOnProperty, so an absent property means
# no seeding.
app.seed.enabled=true

# ---------------------------------------------------------------------
# Pagination limits
# ---------------------------------------------------------------------
# Caps the ?size= parameter on every Pageable endpoint. Without it a client
# can request the entire users table in one call, which is a cheap denial of
# service and a memory spike on the heap.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100


