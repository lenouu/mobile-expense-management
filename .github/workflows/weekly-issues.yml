name: Weekly Issue Rollout

# Runs automatically every Monday at 08:00 UTC, and can also be triggered
# manually from the Actions tab (useful for testing right now instead of
# waiting for Monday).
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch: {}

# Needed so the workflow's built-in token is allowed to create issues and
# push the updated state file back to the repo. No personal access token
# needs to be created or stored for this to work.
permissions:
  contents: write
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Roll out this week's sprint issues
        id: rollout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/weekly_rollout.py

      - name: Commit updated rollout state
        if: steps.rollout.outputs.rolled_out == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/state.json
          git commit -m "chore: mark sprint ${{ steps.rollout.outputs.sprint }} issues as rolled out" || echo "Nothing to commit"
          git push
